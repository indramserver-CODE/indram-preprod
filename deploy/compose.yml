# Runs on the EC2 host under /opt/indram/release/current.
# Variables come from /opt/indram/.env (rendered by deploy.sh from SSM Parameter Store).
services:
  api:
    image: ${API_IMAGE}
    container_name: indram-api
    restart: unless-stopped
    env_file:
      - /opt/indram/.env
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2.9-alpine
    container_name: indram-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/indram/www:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
